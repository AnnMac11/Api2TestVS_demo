    <rect x="52" y="188" width="13" height="13" rx="2" fill="#0e639c" stroke="#0e639c"/>
    <text x="54" y="199" font-size="10" fill="#ffffff">&#10003;</text>
    <text x="78" y="200">AddPet_ReturnsCreated</text>
    <text x="330" y="200">PetStore</text>
    <text x="470" y="200">1</text>
