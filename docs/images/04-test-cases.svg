    <circle cx="650" cy="161" r="5" fill="#a6e22e"/>
    <text x="662" y="166" font-size="11">passed</text>
    <text x="738" y="166" fill="#75beff">edit</text>
    <text x="794" y="166" fill="#a6e22e" font-size="13">&#9654;</text>
    <text x="830" y="166" fill="#f48771">delete</text>

