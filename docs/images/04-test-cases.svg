  <rect x="40" y="110" width="820" height="208" fill="none" stroke="#3c3c3c"/>

  <text x="40" y="348" fill="#9d9d9d" font-size="12">Execute (&#9654;) deploys one case into the sandbox, builds it and runs it &#8212; Status then shows the last result.</text>
  <text x="40" y="370" fill="#9d9d9d" font-size="12">Tick rows and press Deploy to write them into your own project. Steps counts the calls in the chain; 1 is a single-call test.</text>
</svg>
